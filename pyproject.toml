[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.0.15",
    "anthropic==0.58.2",
    "sentence-transformers==5.0.0",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "black>=25.1,<26",
    "flake8>=7.1,<8",
    "isort>=6.0,<7",
    "pytest>=8.3,<9",
    "pytest-mock>=3.14,<4",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-ra -m \"not live\""
markers = [
    "live: hits the real Anthropic API (needs a valid ANTHROPIC_API_KEY, costs tokens, run manually)",
]

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = '''
/(
    \.venv
  | \.trees
  | backend/chroma_db
)/
'''

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["backend", "main.py"]
skip_gitignore = true
extend_skip = [".trees", "chroma_db"]
