services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Bind-mount the whole repo into the container so edits on your Mac
      # show up instantly — no rebuild needed for code changes.
      - .:/app
      # But NOT for the virtual env: a plain bind mount of the repo would
      # hide the .venv that `uv sync` built into the image at /app/.venv
      # (your host has no .venv, since torch can't install natively here).
      # This named volume is more specific than the bind mount above, so
      # Docker keeps using the one baked into the image instead.
      - venv:/app/.venv
    working_dir: /app/backend
    command: uv run uvicorn app:app --host 0.0.0.0 --port 8000 --reload

volumes:
  venv:
